<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<title>工位动作打卡</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea;
    --fg:#17181a; --muted:#6b7280; --dim:#9aa1ab;
    --accent:#2a78d6; --accent-soft:#e8f1fc;
    --ok:#1baf7a; --warn:#eb6834; --water:#0f9bb5;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121316; --card:#1c1e22; --line:#2c2f35;
      --fg:#e9eaec; --muted:#9aa1ab; --dim:#6b7280;
      --accent:#3987e5; --accent-soft:#16243a;
      --ok:#199e70; --warn:#d95926; --water:#2aa6bd;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width:560px; margin:0 auto;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

  header{margin-bottom:22px}
  .date{font-size:13px;color:var(--muted);letter-spacing:.02em}
  h1{font-size:19px;font-weight:650;margin:4px 0 18px}
  .today{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; display:flex; align-items:baseline; gap:10px;
  }
  .today .num{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .today .of{font-size:15px;color:var(--muted)}
  .today .done{margin-left:auto;font-size:14px;color:var(--ok);font-weight:600}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;
           transition:width .25s ease}

  .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .ex{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden;
  }
  .ex.hit{border-color:var(--ok)}
  .row-main{display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer}
  .idx{
    width:26px;height:26px;flex:0 0 26px;border-radius:50%;
    background:var(--accent-soft); color:var(--accent);
    display:grid;place-items:center;font-size:13px;font-weight:700;
  }
  .ex.hit .idx{background:var(--ok);color:#fff}
  .meta{flex:1;min-width:0}
  .name{display:block;font-weight:600;font-size:15px}
  .spec{display:block;font-size:13px;color:var(--muted);margin-top:1px}
  .count{
    font-variant-numeric:tabular-nums; font-size:15px; color:var(--muted);
    min-width:44px; text-align:right;
  }
  .count b{color:var(--fg);font-size:17px}
  .btns{display:flex;gap:8px;align-items:center}
  .plus{
    width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;
    font-size:22px;font-weight:600;display:grid;place-items:center;
    transition:transform .08s ease, filter .12s ease;
  }
  .plus:active{transform:scale(.92);filter:brightness(.92)}
  .minus{
    width:34px;height:44px;border-radius:12px;border:1px solid var(--line);
    color:var(--dim);font-size:18px;display:grid;place-items:center;
  }
  .minus:active{background:var(--line)}

  /* 展开区 */
  .detail{display:none; padding:0 16px 14px; border-top:1px solid var(--line)}
  .ex.open .detail{display:block}
  .rec{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    margin-top:12px;
  }
  .rec .unit{font-size:13px;color:var(--dim)}
  .rec button.go{
    margin-left:auto; padding:9px 16px; border-radius:10px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600;
  }
  .rec button.go:active{filter:brightness(.92)}
  input[type=number]{
    font:inherit;font-variant-numeric:tabular-nums;
    width:56px;padding:9px 6px;text-align:center;
    border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--fg);
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
    padding:4px 6px 4px 10px; font-size:13px; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--fg);font-weight:600}
  .chip .x{
    width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    color:var(--dim);font-size:15px;line-height:1;
  }
  .chip .x:active{background:var(--line)}
  .empty{font-size:13px;color:var(--dim);margin-top:10px}

  /* 另外两件 */
  .ex.water .idx{background:rgba(15,155,181,.14);color:var(--water)}
  .ex.water.hit .idx{background:var(--water);color:#fff}
  .ex.water.hit{border-color:var(--water)}
  .ex.extra .idx{background:var(--accent-soft)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{padding:7px 14px;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--accent);color:#fff}

  .sect{margin-top:26px}
  .sect h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;
           letter-spacing:.04em;text-transform:uppercase}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:10px;
       padding:8px 4px;text-align:center}
  .day .d{font-size:11px;color:var(--dim)}
  .day .v{font-size:15px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
  .day.met{border-color:var(--ok)}
  .day.met .v{color:var(--ok)}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

  .data{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .data button{
    padding:10px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);font-size:14px;color:var(--fg);
  }
  .data button:active{background:var(--line)}
  .data button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  details{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--dim)}
  details[open] summary::before{content:"▾ "}
  .set{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:10px}
  .cfg{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .cfg .row{font-size:14px}
  .cfg .lbl{color:var(--muted)}
  .cfg .fields{display:flex;align-items:center;gap:6px}
  .cfg input{width:52px;padding:7px 6px}
  .ghost{
    margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;color:var(--muted);background:var(--card);align-self:flex-start;
  }
  .note{font-size:12px;color:var(--dim);line-height:1.7;margin-top:14px}
  .warn{color:var(--warn);font-weight:600}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;
    font-size:14px;opacity:0;pointer-events:none;transition:.22s ease;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="date" id="date"></div>
  <h1>工位动作</h1>
  <div class="today">
    <span class="num" id="rounds">0</span>
    <span class="of">/ <span id="target">3</span> 轮</span>
    <span class="done" id="doneMsg"></span>
  </div>
  <div class="bar"><i id="barFill" style="width:0%"></i></div>
</header>

<main>
  <div class="list" id="list"></div>

  <section class="sect">
    <h2>另外两件</h2>
    <div class="list" id="extras" style="margin-top:0"></div>
  </section>

  <section class="sect">
    <h2>最近 7 天</h2>
    <div class="week" id="week"></div>
  </section>

  <section class="sect">
    <h2>数据</h2>
    <div class="data">
      <button class="primary" id="csv">导出汇总 CSV</button>
      <button id="csvd">导出明细 CSV</button>
      <button id="json">导出 JSON</button>
      <button id="importBtn">导入 JSON</button>
      <button id="resetDay">清空今天</button>
    </div>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </section>

  <details>
    <summary>设置与说明</summary>

    <div class="set">
      <div class="row">
        <span>每日目标</span>
        <div class="seg" id="segTarget">
          <button data-v="3">3 轮</button><button data-v="6">6 轮</button>
        </div>
      </div>
      <div class="row">
        <span>显示进阶动作</span>
        <div class="seg" id="segAdv">
          <button data-v="0">关</button><button data-v="1">开</button>
        </div>
      </div>
      <div class="row">
        <span>接水目标</span>
        <span class="fields"><input type="number" id="waterTarget" min="1" max="20"><span class="unit">次/天</span></span>
      </div>
    </div>

    <div class="cfg" id="cfg"></div>
    <button class="ghost" id="resetSpec">恢复默认参数</button>

    <p class="note">
      <span class="warn">点卡片展开</span>，可以填这一次实际做了多少，再点「记录」——
      这样每次都能单独记，不一定要按默认值。<br>
      直接用 <b>+</b> 则按上面的默认参数记一次。<br><br>
      <b>第 1 周</b>：3 轮，只做前 4 个。<b>第 2 周</b>：6 轮。<b>第 3 周</b>：打开进阶。<br>
      <span class="warn">全程正常呼吸，绝对不要憋气。</span>等长收缩时屏气会使血压瞬间升高。<br><br>
      数据只存在这台设备的浏览器里，不上传任何服务器。<br>
      <b>换设备或清理浏览器前，先导出 JSON。</b>
    </p>
  </details>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const KEY = "desk-checkin-v1";
  const WD = ["日","一","二","三","四","五","六"];

  /* kind:"reps" 只有次数；kind:"hold" 有（秒 × 次数）；dur/reps 是默认值 */
  const EX = [
    {id:"ankle",   name:"踝泵",         kind:"reps", verb:"上勾下压", reps:15},
    {id:"glute",   name:"臀肌收紧",     kind:"hold", dur:5,  reps:3},
    {id:"core",    name:"收腹坐直",     kind:"hold", dur:5,  reps:5},
    {id:"scapula", name:"肩胛后缩下沉", kind:"hold", dur:5,  reps:5},
    {id:"chin",    name:"下巴回收",     kind:"hold", dur:5,  reps:5,  adv:true},
    {id:"grip",    name:"握力等长",     kind:"hold", dur:10, reps:3,  adv:true}
  ];
  const EXMAP = Object.create(null);
  EX.forEach(e => EXMAP[e.id] = e);

  function clamp(v, lo, hi){
    v = Math.round(Number(v));
    if(!isFinite(v)) v = lo;
    return Math.min(hi, Math.max(lo, v));
  }
  function defaultSpecs(){
    const o = {};
    EX.forEach(e => o[e.id] = {dur: e.kind === "hold" ? e.dur : null, reps: e.reps});
    return o;
  }
  const DEFAULTS = defaultSpecs();

  /* ---------- state ---------- */
  let mem = null;

  /* 旧数据迁移：数字 → 展开成对应条数的记录 */
  function migrateDay(rec){
    const out = {};
    if(!rec || typeof rec !== "object") return out;
    EX.forEach(e => {
      const v = rec[e.id];
      const d = DEFAULTS[e.id];
      if(Array.isArray(v)){
        const arr = v.map(x => ({
          dur : e.kind === "hold" ? clamp((x && x.dur) ?? d.dur, 1, 600) : null,
          reps: clamp((x && x.reps) ?? d.reps, 1, 999)
        }));
        if(arr.length) out[e.id] = arr;
      }else if(typeof v === "number" && v > 0){
        out[e.id] = Array.from({length: Math.min(v, 60)},
                               () => ({dur: d.dur, reps: d.reps}));
      }
    });
    if(typeof rec.water === "number" && rec.water > 0) out.water = rec.water;
    if(Array.isArray(rec.walks) && rec.walks.length) out.walks = rec.walks.slice();
    return out;
  }

  function normalize(s){
    s = s && typeof s === "object" ? s : {};
    const d = DEFAULTS, specs = {};
    EX.forEach(e => {
      const cur = (s.specs && s.specs[e.id]) || {};
      specs[e.id] = {
        dur : e.kind === "hold" ? clamp(cur.dur ?? d[e.id].dur, 1, 600) : null,
        reps: clamp(cur.reps ?? d[e.id].reps, 1, 999)
      };
    });
    const days = {};
    if(s.days && typeof s.days === "object"){
      Object.keys(s.days).forEach(k => days[k] = migrateDay(s.days[k]));
    }
    return {
      v: 3,
      target: s.target === 6 ? 6 : 3,
      adv: !!s.adv,
      waterTarget: clamp(s.waterTarget ?? 6, 1, 20),
      walkDefault: clamp(s.walkDefault ?? 10, 1, 180),
      specs,
      days
    };
  }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return normalize(JSON.parse(raw));
    }catch(e){}
    return normalize({});
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ mem = state; }
  }
  let state = load();

  /* ---------- 日期与记录 ---------- */
  function todayKey(d){
    d = d || new Date();
    const p = n => String(n).padStart(2,"0");
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }
  function dayRec(k){
    if(!state.days[k]) state.days[k] = {};
    return state.days[k];
  }
  function activeEx(){ return EX.filter(e => state.adv || !e.adv); }
  function recordsOf(k, id){
    const rec = state.days[k];
    const v = rec && rec[id];
    return Array.isArray(v) ? v : [];
  }
  function countOf(k, id){ return recordsOf(k, id).length; }
  function roundsOf(k){
    const list = activeEx();
    if(!list.length) return 0;
    return Math.min.apply(null, list.map(e => countOf(k, e.id)));
  }
  function walksOf(k){
    const rec = state.days[k];
    return rec && Array.isArray(rec.walks) ? rec.walks : [];
  }
  function walkMin(k){ return walksOf(k).reduce((a,b)=>a+b, 0); }

  /* ---------- 文案 ---------- */
  function fmt(r, e){
    return e.kind === "reps" ? String(r.reps) : (r.dur + "秒×" + r.reps);
  }
  function specText(e){
    const sp = state.specs[e.id];
    if(e.kind === "reps") return (e.verb || "") + " ×" + sp.reps;
    return sp.dur + " 秒 ×" + sp.reps;
  }

  /* ---------- render ---------- */
  const $ = id => document.getElementById(id);
  const cards = Object.create(null);
  let builtFor = "";
  const open = Object.create(null);   // 哪些卡片是展开的

  function build(){
    const sig = state.target + "|" + (state.adv ? 1 : 0) + "|" + state.waterTarget;
    if(sig === builtFor) return;
    builtFor = sig;

    const list = $("list");
    list.innerHTML = "";
    for(const k in cards) delete cards[k];

    activeEx().forEach((e, i) => {
      const el = document.createElement("div");
      el.className = "ex";
      el.innerHTML =
        '<div class="row-main">' +
          '<span class="idx"></span>' +
          '<span class="meta"><span class="name"></span><span class="spec"></span></span>' +
          '<span class="count"></span>' +
          '<span class="btns">' +
            '<button class="minus" aria-label="撤销最后一次">−</button>' +
            '<button class="plus" aria-label="按默认参数记一次">+</button>' +
          '</span>' +
        '</div>' +
        '<div class="detail">' +
          '<div class="rec"></div>' +
          '<div class="chips"></div>' +
        '</div>';

      el.querySelector(".name").textContent = e.name;

      const rowMain = el.querySelector(".row-main");
      rowMain.addEventListener("click", ev => {
        if(ev.target.closest("button")) return;
        open[e.id] = !open[e.id];
        el.classList.toggle("open", !!open[e.id]);
        if(open[e.id]) fillRecInputs(e);
      });

      el.querySelector(".plus").addEventListener("click", ev => {
        ev.stopPropagation();
        addRecord(e.id, state.specs[e.id].dur, state.specs[e.id].reps);
      });
      el.querySelector(".minus").addEventListener("click", ev => {
        ev.stopPropagation();
        popRecord(e.id);
      });

      list.appendChild(el);
      cards[e.id] = {
        el, idx: el.querySelector(".idx"),
        spec: el.querySelector(".spec"),
        count: el.querySelector(".count"),
        rec: el.querySelector(".rec"),
        chips: el.querySelector(".chips")
      };
      el.classList.toggle("open", !!open[e.id]);
    });

    buildExtras();
  }

  /* 展开区：输入行（预填上一次的值） */
  function fillRecInputs(e){
    const c = cards[e.id]; if(!c) return;
    const box = c.rec;
    if(box.dataset.ready === e.id) return;
    box.dataset.ready = e.id;

    const recs = recordsOf(todayKey(), e.id);
    const last = recs.length ? recs[recs.length-1] : state.specs[e.id];

    box.innerHTML = "";
    if(e.kind === "hold"){
      const dIn = document.createElement("input");
      dIn.type = "number"; dIn.min = 1; dIn.max = 600;
      dIn.className = "dur"; dIn.value = last.dur ?? state.specs[e.id].dur;
      const u1 = document.createElement("span");
      u1.className = "unit"; u1.textContent = "秒";
      const x = document.createElement("span");
      x.className = "unit"; x.textContent = "×";
      const rIn = document.createElement("input");
      rIn.type = "number"; rIn.min = 1; rIn.max = 999;
      rIn.className = "reps"; rIn.value = last.reps;
      const u2 = document.createElement("span");
      u2.className = "unit"; u2.textContent = "次";
      box.append(dIn, u1, x, rIn, u2);
    }else{
      const rIn = document.createElement("input");
      rIn.type = "number"; rIn.min = 1; rIn.max = 999;
      rIn.className = "reps"; rIn.value = last.reps;
      const u = document.createElement("span");
      u.className = "unit"; u.textContent = (e.verb || "") + " 次数";
      box.append(rIn, u);
    }

    const go = document.createElement("button");
    go.className = "go"; go.textContent = "记录";
    go.addEventListener("click", ev => {
      ev.stopPropagation();
      const dur  = box.querySelector(".dur");
      const reps = box.querySelector(".reps");
      addRecord(e.id,
        dur ? clamp(dur.value, 1, 600) : null,
        clamp(reps.value, 1, 999));
    });
    box.appendChild(go);
  }

  function buildExtras(){
    const box = $("extras");
    box.innerHTML = "";

    /* 接水 */
    const w = document.createElement("div");
    w.className = "ex water";
    w.innerHTML =
      '<div class="row-main">' +
        '<span class="idx">水</span>' +
        '<span class="meta"><span class="name">接水</span><span class="spec"></span></span>' +
        '<span class="count"></span>' +
        '<span class="btns">' +
          '<button class="minus" aria-label="减一">−</button>' +
          '<button class="plus" aria-label="加一">+</button>' +
        '</span>' +
      '</div>';
    w.querySelector(".plus").addEventListener("click", () => water(+1));
    w.querySelector(".minus").addEventListener("click", () => water(-1));
    box.appendChild(w);
    cards.water = {el: w, spec: w.querySelector(".spec"), count: w.querySelector(".count")};

    /* 散步 */
    const s = document.createElement("div");
    s.className = "ex extra";
    s.innerHTML =
      '<div class="row-main">' +
        '<span class="idx">走</span>' +
        '<span class="meta"><span class="name">散步</span><span class="spec"></span></span>' +
        '<span class="btns">' +
          '<input type="number" class="mins" inputmode="numeric" min="1" max="180" aria-label="分钟">' +
          '<span class="unit" style="font-size:13px;color:var(--dim)">分</span>' +
          '<button class="minus" aria-label="撤销上一次">−</button>' +
          '<button class="plus" aria-label="记录一次">+</button>' +
        '</span>' +
      '</div>';
    const inp = s.querySelector(".mins");
    inp.value = state.walkDefault;
    s.querySelector(".plus").addEventListener("click", ev => {
      ev.stopPropagation();
      const v = clamp(inp.value, 1, 180);
      inp.value = v; state.walkDefault = v;
      const rec = dayRec(todayKey());
      if(!Array.isArray(rec.walks)) rec.walks = [];
      rec.walks.push(v);
      save(); refresh(); toast("记下 " + v + " 分钟");
    });
    s.querySelector(".minus").addEventListener("click", ev => {
      ev.stopPropagation();
      const rec = dayRec(todayKey());
      if(!Array.isArray(rec.walks) || !rec.walks.length){ toast("没有可撤销的"); return; }
      const v = rec.walks.pop();
      if(!rec.walks.length) delete rec.walks;
      save(); refresh(); toast("撤销 " + v + " 分钟");
    });
    inp.addEventListener("click", ev => ev.stopPropagation());
    box.appendChild(s);
    cards.walk = {el: s, spec: s.querySelector(".spec")};
  }

  function refresh(){
    const k = todayKey();
    const d = new Date();
    $("date").textContent = k + " · 周" + WD[d.getDay()];
    $("target").textContent = state.target;

    const rounds = roundsOf(k);
    $("rounds").textContent = Math.min(rounds, state.target);
    $("barFill").style.width = Math.min(100, rounds / state.target * 100) + "%";
    $("doneMsg").textContent = rounds >= state.target ? "完成 ✓" : "";

    activeEx().forEach((e, i) => {
      const c = cards[e.id]; if(!c) return;
      const recs = recordsOf(k, e.id);
      const n = recs.length;
      const hit = n >= state.target;
      c.el.classList.toggle("hit", hit);
      c.idx.textContent = hit ? "✓" : (i + 1);
      c.spec.textContent = specText(e);
      c.count.innerHTML = "<b>" + n + "</b> / " + state.target;

      /* 记录胶囊 */
      c.chips.innerHTML = "";
      if(!recs.length){
        const p = document.createElement("div");
        p.className = "empty"; p.textContent = "今天还没有记录";
        c.chips.appendChild(p);
      }else{
        recs.forEach((r, idx) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = '<b>' + fmt(r, e) + '</b>' +
            '<button class="x" aria-label="删除这条">✕</button>';
          chip.querySelector(".x").addEventListener("click", ev => {
            ev.stopPropagation();
            delRecord(e.id, idx);
          });
          c.chips.appendChild(chip);
        });
      }
      if(c.el.classList.contains("open")) fillRecInputs(e);
    });

    const wn = (state.days[k] && state.days[k].water) || 0;
    if(cards.water){
      const hit = wn >= state.waterTarget;
      cards.water.el.classList.toggle("hit", hit);
      cards.water.spec.textContent = hit ? "今天够了" : "每次接水点一下";
      cards.water.count.innerHTML = "<b>" + wn + "</b> / " + state.waterTarget;
    }

    const ws = walksOf(k);
    if(cards.walk){
      cards.walk.spec.textContent = ws.length
        ? "今天 " + ws.length + " 次 · 共 " + walkMin(k) + " 分钟"
        : "填分钟 → +";
    }

    const week = $("week");
    week.innerHTML = "";
    for(let i = 6; i >= 0; i--){
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i);
      const r = roundsOf(todayKey(dt));
      const met = r >= state.target;
      const el = document.createElement("div");
      el.className = "day" + (met ? " met" : "") + (i === 0 ? " today" : "");
      el.innerHTML = '<div class="d">周' + WD[dt.getDay()] + '</div>' +
                     '<div class="v">' + (r || "·") + '</div>';
      week.appendChild(el);
    }

    document.querySelectorAll("#segTarget button").forEach(b =>
      b.classList.toggle("on", +b.dataset.v === state.target));
    document.querySelectorAll("#segAdv button").forEach(b =>
      b.classList.toggle("on", +b.dataset.v === (state.adv ? 1 : 0)));
    $("waterTarget").value = state.waterTarget;
    buildCfg();
  }

  /* ---------- 参数编辑（默认值） ---------- */
  function buildCfg(){
    const box = $("cfg");
    if(box.childElementCount === activeEx().length) return;
    box.innerHTML = "";
    activeEx().forEach(e => {
      const row = document.createElement("div");
      row.className = "row";
      const f = document.createElement("span");
      f.className = "fields";
      if(e.kind === "reps"){
        f.innerHTML = '<span class="lbl">' + (e.verb||"") +
                      ' 次数</span><input type="number" min="1" max="999">';
        const inp = f.querySelector("input");
        inp.value = state.specs[e.id].reps;
        inp.addEventListener("change", () => {
          state.specs[e.id].reps = clamp(inp.value, 1, 999);
          inp.value = state.specs[e.id].reps; save(); refresh();
        });
      }else{
        f.innerHTML =
          '<input type="number" min="1" max="600"><span class="lbl">秒 ×</span>' +
          '<input type="number" min="1" max="999"><span class="lbl">次</span>';
        const [dIn, rIn] = f.querySelectorAll("input");
        dIn.value = state.specs[e.id].dur; rIn.value = state.specs[e.id].reps;
        dIn.addEventListener("change", () => {
          state.specs[e.id].dur = clamp(dIn.value, 1, 600);
          dIn.value = state.specs[e.id].dur; save(); refresh();
        });
        rIn.addEventListener("change", () => {
          state.specs[e.id].reps = clamp(rIn.value, 1, 999);
          rIn.value = state.specs[e.id].reps; save(); refresh();
        });
      }
      const lbl = document.createElement("span");
      lbl.className = "lbl"; lbl.textContent = e.name;
      row.appendChild(lbl); row.appendChild(f);
      box.appendChild(row);
    });
  }

  /* ---------- 操作 ---------- */
  function addRecord(id, dur, reps){
    const e = EXMAP[id];
    const k = todayKey();
    const rec = dayRec(k);
    if(!Array.isArray(rec[id])) rec[id] = [];
    rec[id].push({dur: e.kind === "hold" ? clamp(dur, 1, 600) : null,
                  reps: clamp(reps, 1, 999)});
    save(); refresh();
    if(roundsOf(k) >= state.target && !addRecord._shown){
      addRecord._shown = true; toast("今天目标完成 ✓");
    }
  }
  function popRecord(id){
    const rec = state.days[todayKey()];
    if(!rec || !Array.isArray(rec[id]) || !rec[id].length){ toast("没有可撤销的"); return; }
    rec[id].pop();
    if(!rec[id].length) delete rec[id];
    save(); refresh();
  }
  function delRecord(id, idx){
    const rec = state.days[todayKey()];
    if(!rec || !Array.isArray(rec[id])) return;
    rec[id].splice(idx, 1);
    if(!rec[id].length) delete rec[id];
    save(); refresh();
  }
  function water(delta){
    const rec = dayRec(todayKey());
    const v = (rec.water || 0) + delta;
    if(v <= 0) delete rec.water; else rec.water = v;
    save(); refresh();
  }

  /* ---------- toast / 下载 ---------- */
  let toastTimer;
  function toast(msg){
    const t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
  }
  function download(name, text, type){
    const blob = new Blob([text], {type: type || "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  }

  /* 汇总：一行一天 */
  $("csv").onclick = function(){
    const keys = Object.keys(state.days).sort();
    const head = ["date"].concat(EX.map(e => e.name))
      .concat(["接水", "散步次数", "散步分钟", "完成轮数"]);
    const lines = [head.join(",")];
    keys.forEach(k => {
      const rec = state.days[k];
      if(!rec || !Object.keys(rec).length) return;
      lines.push([k]
        .concat(EX.map(e => countOf(k, e.id)))
        .concat([rec.water || 0, walksOf(k).length, walkMin(k), roundsOf(k)])
        .join(","));
    });
    if(lines.length === 1){ toast("还没有数据"); return; }
    download("工位动作_汇总_" + todayKey() + ".csv", "﻿" + lines.join("\n"),
             "text/csv;charset=utf-8");
  };

  /* 明细：一行一次记录 */
  $("csvd").onclick = function(){
    const lines = ["date,动作,第几次,秒,次数,备注"];
    Object.keys(state.days).sort().forEach(k => {
      EX.forEach(e => {
        recordsOf(k, e.id).forEach((r, i) => {
          lines.push([k, e.name, i + 1,
                      e.kind === "hold" ? r.dur : "",
                      r.reps, ""].join(","));
        });
      });
      walksOf(k).forEach((m, i) => {
        lines.push([k, "散步", i + 1, "", m, "分钟"].join(","));
      });
      const w = state.days[k] && state.days[k].water;
      if(w) lines.push([k, "接水", 1, "", w, "次"].join(","));
    });
    if(lines.length === 1){ toast("还没有数据"); return; }
    download("工位动作_明细_" + todayKey() + ".csv", "﻿" + lines.join("\n"),
             "text/csv;charset=utf-8");
  };

  $("json").onclick = function(){
    download("工位动作_" + todayKey() + ".json",
             JSON.stringify(state, null, 2), "application/json");
  };
  $("importBtn").onclick = function(){ $("file").click(); };
  $("file").onchange = function(ev){
    const f = ev.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(){
      try{
        const data = normalize(JSON.parse(r.result));
        const cur = Object.keys(state.days).length;
        const inc = Object.keys(data.days).length;
        if(cur && !confirm("导入会覆盖当前 " + cur + " 天记录（文件里有 " + inc + " 天）。继续？")) return;
        state = data; builtFor = ""; save(); render(); toast("已导入 " + inc + " 天");
      }catch(e){ toast("文件格式不对"); }
    };
    r.readAsText(f);
    ev.target.value = "";
  };
  $("resetDay").onclick = function(){
    if(!confirm("清空今天的记录？")) return;
    delete state.days[todayKey()];
    save(); render(); toast("今天已清空");
  };

  /* ---------- settings ---------- */
  $("segTarget").onclick = function(ev){
    const b = ev.target.closest("button"); if(!b) return;
    state.target = +b.dataset.v; builtFor = ""; save(); render();
  };
  $("segAdv").onclick = function(ev){
    const b = ev.target.closest("button"); if(!b) return;
    state.adv = b.dataset.v === "1"; builtFor = ""; save(); render();
  };
  $("waterTarget").onchange = function(){
    state.waterTarget = clamp(this.value, 1, 20);
    this.value = state.waterTarget; builtFor = ""; save(); render();
  };
  $("resetSpec").onclick = function(){
    if(!confirm("把所有动作的默认参数恢复成默认值？已记录的数据不受影响。")) return;
    state.specs = defaultSpecs();
    for(const id in cards){ delete cards[id].rec.dataset.ready; }
    builtFor = ""; save(); render(); toast("已恢复默认");
  };

  /* ---------- boot ---------- */
  function render(){ build(); refresh(); }
  render();

  let day = todayKey();
  setInterval(function(){
    const now = todayKey();
    if(now !== day){
      day = now; addRecord._shown = false; builtFor = "";
      for(const id in cards){ delete cards[id].rec.dataset.ready; }
      render();
    }
  }, 30000);
})();
</script>
</body>
</html>
